          <div class="field grow">

          <button class="btn-ghost" id="chat-clear" type="button">Effacer</button>

            </svg>
            <input type="text" id="chat-api-key" placeholder="Coller votre clé API ici…" style="flex: 1; background: transparent; border: none; outline: none; font-family: inherit; font-size: inherit; color: inherit;">
            <button class="btn-ghost btn-sm" type="button" onclick="toggleApiKeyBar()" style="flex-shrink: 0;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="chat-body" id="chat-body">
          <div class="empty-chat">
            <div class="big">💬</div>
            Sélectionne un modèle et envoie un message de test.
          </div>
        </div>
        <div class="chat-input">
          <textarea id="chat-input" rows="1" placeholder="Message… (Entrée pour envoyer, Maj+Entrée pour nouvelle ligne)"></textarea>
          <button class="btn-primary" id="chat-send" type="button">Envoyer</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin.js"></script>
<script>
let chatHistory = [];
let chatBusy = false;

function initChatSelectors() {
  const models = ["deepseek-chat", "qwen-chat", "claude-chat", "gemini-chat"];
  $("chat-model").innerHTML = models.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
}

function addMsg(role, text) {
  const body = $("chat-body");
  const empty = body.querySelector(".empty-chat");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="who">${role === "user" ? "Vous" : "Assistant"}</div><div class="content">${esc(text)}</div>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

function setMsgContent(el, text) {
  const c = el.querySelector(".content");
  c.textContent = text;
  $("chat-body").scrollTop = $("chat-body").scrollHeight;
}

function getApiKeyHeader() {
  const apiKey = document.getElementById('chat-api-key').value.trim();
  if (apiKey) {
    return { "Authorization": "Bearer " + apiKey };
  }
  return {};
}

async function streamChat(provider, model, messages, onDelta) {
  const headers = {
    "Content-Type": "application/json",
    ...getApiKeyHeader()
  };
  const res = await fetch("/v1/chat/completions", {
    method: "POST",
    headers: headers,
    body: JSON.stringify({ provider, model, messages, stream: true }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error?.message || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data: ")) continue;
      const data = line.slice(6).trim();
      if (data === "[DONE]") return;
      try {
        const json = JSON.parse(data);
        const delta = json.choices?.[0]?.delta?.content;
        if (delta) onDelta(delta);
      } catch (_) {}
    }
  }
}

async function sendChat() {
  if (chatBusy) return;
  const model = $("chat-model").value;
  const text = $("chat-input").value.trim();
  if (!text) return;
  const system = $("chat-context").value.trim();
  const modelToProvider = {
    "deepseek-chat": "deepseek",
    "qwen-chat": "qwen",
    "claude-chat": "claude",
    "gemini-chat": "gemini",
  };
  const provider = modelToProvider[model] || model.split("-")[0];

  $("chat-input").value = "";
  addMsg("user", text);
  const assistantEl = addMsg("assistant", "");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  assistantEl.querySelector(".content").appendChild(cursor);
  chatBusy = true;
  $("chat-send").disabled = true;
  let full = "";
  const messages = [];
  if (system) messages.push({ role: "system", content: system });
  for (const m of chatHistory) messages.push(m);
  messages.push({ role: "user", content: text });
  try {
    await streamChat(provider, model, messages, (delta) => {
      full += delta;
      setMsgContent(assistantEl, full);
    });
    chatHistory.push({ role: "user", content: text });
    chatHistory.push({ role: "assistant", content: full });
  } catch (e) {
    setMsgContent(assistantEl, "");
    assistantEl.classList.add("error");
    assistantEl.querySelector(".who").textContent = "Erreur";
    setMsgContent(assistantEl, e.message);
  } finally {
    chatBusy = false;
    $("chat-send").disabled = false;
    $("chat-input").focus();
  }
}

async function refresh() {
  try {
    const state = await api("/extension/state");
    setConn(!!state.connected, !!state.busy);
  } catch (e) {
    setConn(false, false);
    if ($("sconn")) $("sconn").textContent = "Proxy inaccessible : " + e.message;
    if ($("hconn")) $("hconn").textContent = "Proxy inaccessible";
  }
}

$("chat-send").addEventListener("click", sendChat);
$("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});
$("chat-clear").addEventListener("click", () => {
  chatHistory = [];
  $("chat-body").innerHTML =
    '<div class="empty-chat"><div class="big">💬</div>Sélectionne un modèle et envoie un message de test.</div>';
});

function toggleApiKeyBar() {
  const bar = document.getElementById('api-key-bar');
  const input = document.getElementById('chat-api-key');
  if (bar.style.display === 'none') {
    bar.style.display = 'flex';
    input.focus();
  } else {
    bar.style.display = 'none';
    input.value = '';
  }
}

async function checkApiProtection() {
  try {
    const res = await fetch('/api-keys/config');
    if (res.ok) {
      const data = await res.json();
      if (data.require_auth) {
        document.getElementById('api-key-bar').style.display = 'flex';
      }
    }
  } catch (e) {
    console.log('Impossible de vérifier la protection API:', e);
  }
}

initChatSelectors();
refresh();
setInterval(refresh, 1500);
checkApiProtection();
</script>
</body>
