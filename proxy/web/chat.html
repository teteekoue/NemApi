<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NemApi · Chat test</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nemapi-theme")||"dark"}catch(e){}</script>
<link rel="stylesheet" href="/admin.css?v=5.2.0">
<link rel="icon" href="/icons/logo-32.png" type="image/png">
</head>
<body data-page="chat" data-title="Chat test">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1>Chat test</h1>
          <div class="sub">Envoie une vraie requête à travers le proxy pour vérifier un fournisseur (mode classique).</div>
        </div>
      </div>

      <div class="card chat-wrap">
        <div class="chat-toolbar">
          <div class="field"><label for="chat-model">Modèle</label><select id="chat-model"></select></div>
          <div class="field grow"><label for="chat-context">Instruction système (optionnel)</label><input type="text" id="chat-context" placeholder="Tu es un assistant concis…"></div>
          <div class="field" id="api-key-field" hidden><label for="chat-api-key">Clé API</label><input type="password" id="chat-api-key" placeholder="nemapi-token…" autocomplete="off"></div>
          <button class="btn" id="chat-clear" type="button">Effacer</button>
        </div>
        <div class="chat-body" id="chat-body"></div>
        <div class="attach-row" id="chat-attach-row"></div>
        <div class="chat-input">
          <input type="file" id="chat-file" accept="image/*" multiple hidden>
          <button class="btn attach-btn" id="chat-attach" type="button" title="Joindre une image (envoyée en image_url, format OpenAI)" aria-label="Joindre une image"></button>
          <textarea id="chat-input" class="input" rows="1" placeholder="Message… (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne, Ctrl+V pour coller une capture)"></textarea>
          <button class="btn btn-primary" id="chat-send" type="button">Envoyer</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/admin.js?v=5.2.0"></script>
<script>
"use strict";
let chatHistory = [];
let busy = false;
let modelProvider = {};
const EMPTY = `<div class="empty-chat">${icon("chat", "")}<div>Choisis un modèle et envoie un message de test.</div></div>`;
$("chat-body").innerHTML = EMPTY;
$("chat-send").insertAdjacentHTML("afterbegin", icon("send", ""));

async function loadModels() {
  try {
    const { providers } = await api("/providers");
    const opts = [];
    for (const p of providers) {
      for (const m of p.models || []) {
        modelProvider[m] = p.id;
        opts.push(`<option value="${esc(m)}">${esc(providerLabel(p.id))} · ${esc(m)}</option>`);
      }
    }
    $("chat-model").innerHTML = opts.join("");
    const saved = localStorage.getItem("nemapi-chat-model");
    if (saved && modelProvider[saved]) $("chat-model").value = saved;
  } catch (e) {
    toast("Liste des modèles indisponible : " + e.message, "error");
  }
}
$("chat-model").addEventListener("change", () => { try { localStorage.setItem("nemapi-chat-model", $("chat-model").value); } catch (_) {} });

function addMsg(role, text, images) {
  const body = $("chat-body");
  body.querySelector(".empty-chat")?.remove();
  const div = document.createElement("div");
  div.className = "bubble " + role;
  div.innerHTML = `<div class="who">${role === "user" ? "Vous" : "Assistant"}</div><div class="content"></div>`;
  const content = div.querySelector(".content");
  content.textContent = text;
  if (images && images.length) {
    const thumbs = document.createElement("div");
    thumbs.className = "thumbs";
    for (const img of images) {
      const el = document.createElement("img");
      el.src = img.url;
      el.alt = img.name || "image";
      el.title = img.name || "";
      thumbs.appendChild(el);
    }
    div.appendChild(thumbs);
  }
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

/* ---------------------------------------------------------------- attachments */
// OpenAI multimodal format: the image goes in the message as an image_url
// part (base64 data URL). The proxy forwards it to the extension, which
// uploads it through the provider's own file input.
const MAX_IMAGE_BYTES = 20 * 1024 * 1024;
let pendingImages = [];

function humanSize(n) {
  if (n < 1024) return n + " o";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " Ko";
  return (n / (1024 * 1024)).toFixed(2) + " Mo";
}

function renderAttachments() {
  const row = $("chat-attach-row");
  row.innerHTML = "";
  pendingImages.forEach((img, i) => {
    const chip = document.createElement("div");
    chip.className = "attach-chip";
    chip.innerHTML = `<img alt=""><div class="meta"><span class="name"></span><span class="size"></span></div><button class="rm" type="button" title="Retirer">×</button>`;
    chip.querySelector("img").src = img.url;
    chip.querySelector(".name").textContent = img.name;
    chip.querySelector(".size").textContent = humanSize(img.size);
    chip.querySelector(".rm").addEventListener("click", () => {
      pendingImages.splice(i, 1);
      renderAttachments();
    });
    row.appendChild(chip);
  });
}

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ""));
    fr.onerror = () => reject(fr.error || new Error("lecture impossible"));
    fr.readAsDataURL(file);
  });
}

async function addFiles(fileList) {
  for (const file of Array.from(fileList || [])) {
    if (!/^image\//.test(file.type)) {
      toast(`${file.name} : seules les images sont acceptées`, "error");
      continue;
    }
    if (file.size > MAX_IMAGE_BYTES) {
      toast(`${file.name} : trop lourd (max ${humanSize(MAX_IMAGE_BYTES)})`, "error");
      continue;
    }
    if (pendingImages.length >= 8) {
      toast("Maximum 8 images par message", "error");
      break;
    }
    try {
      const url = await readAsDataURL(file);
      pendingImages.push({ url, name: file.name, size: file.size });
    } catch (e) {
      toast(`${file.name} : ${e.message}`, "error");
    }
  }
  renderAttachments();
}

$("chat-attach").innerHTML = icon("paperclip", "");
$("chat-attach").addEventListener("click", () => $("chat-file").click());
$("chat-file").addEventListener("change", async (e) => {
  await addFiles(e.target.files);
  e.target.value = "";  // same file can be picked again
});
// drag & drop of images onto the conversation
["dragover", "drop"].forEach((type) =>
  $("chat-body").addEventListener(type, (e) => {
    e.preventDefault();
    if (type === "drop" && e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  })
);
// paste an image from the clipboard (screenshot)
document.addEventListener("paste", (e) => {
  const files = Array.from(e.clipboardData?.files || []).filter((f) => /^image\//.test(f.type));
  if (files.length) { e.preventDefault(); addFiles(files); }
});

async function streamChat(model, messages, onDelta) {
  const headers = { "Content-Type": "application/json" };
  const key = $("chat-api-key").value.trim();
  if (key) headers.Authorization = "Bearer " + key;
  const res = await fetch("/v1/chat/completions", {
    method: "POST", headers,
    body: JSON.stringify({ provider: modelProvider[model], model, messages, stream: true }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error?.message || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data: ")) continue;
      const data = line.slice(6).trim();
      if (data === "[DONE]") return;
      let json;
      try { json = JSON.parse(data); } catch (_) { continue; }
      if (json.error) throw new Error(json.error.message || "erreur du proxy");
      const delta = json.choices?.[0]?.delta?.content;
      if (delta) onDelta(delta);
    }
  }
}

async function send() {
  if (busy) return;
  const model = $("chat-model").value;
  const text = $("chat-input").value.trim();
  const images = pendingImages.slice();
  if ((!text && !images.length) || !model) return;
  const system = $("chat-context").value.trim();
  $("chat-input").value = "";
  pendingImages = [];
  renderAttachments();
  addMsg("user", text || "(image)", images);
  const el = addMsg("assistant", "");
  const content = el.querySelector(".content");
  content.innerHTML = '<span class="cursor"></span>';
  busy = true;
  $("chat-send").disabled = true;
  let full = "";
  // OpenAI multimodal shape: text part + one image_url part per image. Only
  // the last turn carries images: the proxy forwards those to the extension.
  const userContent = images.length
    ? [
        ...(text ? [{ type: "text", text }] : []),
        ...images.map((img) => ({ type: "image_url", image_url: { url: img.url }, filename: img.name })),
      ]
    : text;
  const messages = [...(system ? [{ role: "system", content: system }] : []), ...chatHistory, { role: "user", content: userContent }];
  try {
    await streamChat(model, messages, (d) => {
      full += d;
      content.textContent = full;
      $("chat-body").scrollTop = $("chat-body").scrollHeight;
    });
    if (!full) content.textContent = "(réponse vide)";
    chatHistory.push({ role: "user", content: userContent }, { role: "assistant", content: full });
  } catch (e) {
    el.classList.add("error");
    el.querySelector(".who").textContent = "Erreur";
    content.textContent = e.message;
  } finally {
    busy = false;
    $("chat-send").disabled = false;
    $("chat-input").focus();
  }
}

$("chat-send").addEventListener("click", send);
$("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("chat-clear").addEventListener("click", () => {
  chatHistory = [];
  pendingImages = [];
  renderAttachments();
  $("chat-body").innerHTML = EMPTY;
});

loadModels();
api("/api-keys/config").then((c) => { $("api-key-field").hidden = !c.require_auth; }).catch(() => {});
</script>
</body>
</html>
