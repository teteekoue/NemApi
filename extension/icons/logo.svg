<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="NemApi">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- soft ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.25"/>
  <!-- outer nodes = 4 providers -->
  <g filter="url(#glow)">
    <circle cx="64" cy="22" r="7" fill="#38bdf8"/>
    <circle cx="106" cy="64" r="7" fill="#818cf8"/>
    <circle cx="64" cy="106" r="7" fill="#22d3ee"/>
    <circle cx="22" cy="64" r="7" fill="#6366f1"/>
  </g>
  <!-- bridges -->
  <g stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M64 29 V50"/>
    <path d="M99 64 H78"/>
    <path d="M64 99 V78"/>
    <path d="M29 64 H50"/>
  </g>
  <!-- central hub -->
  <circle cx="64" cy="64" r="16" fill="url(#g)" opacity="0.2"/>
  <circle cx="64" cy="64" r="11" fill="url(#g)"/>
  <circle cx="64" cy="64" r="4.5" fill="#0b1220"/>
  <!-- inner accent -->
  <circle cx="64" cy="64" r="2" fill="#e0f2fe"/>
</svg>
